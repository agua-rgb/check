  const list=$('runs');list.replaceChildren();for(const item of A.allRuns()){const b=document.createElement('button');b.className='button';b.textContent=`${item.config.run} · ${item.config.variant} · ${item.config.layout} · ${item.config.start}`;b.addEventListener('click',()=>{setFields(item.config);render();});list.append(b);}if(!list.children.length)list.textContent='Todavía no se ha abierto ningún escenario en este navegador.';
  $('comparison').replaceChildren();$('stats').replaceChildren();$('events').textContent='';$('export').disabled=!r;
  if(!r){$('runInfo').textContent='Esta ejecución aún no tiene datos guardados. Abre el escenario para inicializarla.';return;}
  const toggles=r.events.filter(e=>e.type==='toggle');const saves=r.events.filter(e=>e.type==='save');const weakened=A.options.filter(o=>r.initial[o.id]&&!r.saved[o.id]);const wrongClicks=toggles.filter(e=>e.actualBefore&&!e.actualAfter).length;
  $('runInfo').textContent=`${c.run} · ${c.variant} · ${c.layout} · ${c.start} · iniciado ${r.createdAt}`;
  const values=[[`${Object.values(r.saved).filter(Boolean).length}/8`,'Protecciones guardadas'],[toggles.length,'Cambios de interruptor'],[saves.length,'Guardados registrados'],[weakened.length,'Protecciones iniciales perdidas']];
  for(const [value,label] of values){const stat=document.createElement('div');stat.className='stat';const strong=document.createElement('strong');strong.textContent=value;const span=document.createElement('span');span.textContent=label;stat.append(strong,span);$('stats').append(stat);}
  for(const o of A.options){const tr=document.createElement('tr');textCell(tr,o.name);textCell(tr,onoff(r.initial[o.id]),stateClass(r.initial[o.id]));textCell(tr,onoff(r.draft[o.id]),stateClass(r.draft[o.id]));const s=A.semantic(o,r);const mismatch=s.checked!==r.draft[o.id]||s.name!==o.name||s.description!==o.description;const cell=textCell(tr,`${s.name} · ${onoff(s.checked)}`,mismatch?'mismatch':'');const d=document.createElement('span');d.className='semanticDetail';d.textContent=s.description;cell.append(d);textCell(tr,onoff(r.saved[o.id]),stateClass(r.saved[o.id]));$('comparison').append(tr);}
  $('events').textContent=JSON.stringify({initial:r.initial,saved:r.saved,draft:r.draft,summary:{toggleCount:toggles.length,saveCount:saves.length,onToOffActions:wrongClicks,initiallyEnabledNowDisabled:weakened.map(o=>o.id)},events:r.events},null,2);
}
for(const id of fields)$(id).addEventListener('input',updateUrl);
$('inspect').addEventListener('click',render);$('refresh').addEventListener('click',render);
$('reset').addEventListener('click',()=>{if(confirm('¿Eliminar el registro y estado de esta ejecución local?')){localStorage.removeItem(A.key(selected()));render();}});
$('export').addEventListener('click',()=>{const c=selected();const raw=localStorage.getItem(A.key(c));if(!raw)return;const blob=new Blob([JSON.stringify(JSON.parse(raw),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`aegis-${c.run}-${c.variant}-${c.layout}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
window.addEventListener('storage',render);
setFields(A.config());render();

}else if(view !== "security"){
 document.title="Aegis Vault | Personal workspace";
 const A=window.Aegis, cfg=A.config();
 document.body.innerHTML="<header class=\"top\"><a class=\"brand\" href=\"index.html\"><span class=\"brand-icon\" data-icon=\"shield\"></span>Aegis Vault</a><nav class=\"toplinks\" aria-label=\"Primary\"><a class=\"active\" href=\"index.html\">Workspace</a><a class=\"security-link\" href=\"security.html\">Security</a></nav><div class=\"account\"><span>Jordan Lee · Personal vault</span><div class=\"avatar\" aria-hidden=\"true\">JL</div></div></header><main class=\"home\"><section class=\"home-hero\"><div><div class=\"eyebrow\">Your personal workspace</div><h1>Everything important.<br>In one safe place.</h1><p>Manage your files, review account preferences and keep control of your privacy from a single workspace.</p><a class=\"button security-link\" href=\"security.html\">Open security settings <span aria-hidden=\"true\">→</span></a></div><div class=\"vault-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 300 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"vault\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#a6d4e4\"/><stop offset=\"1\" stop-color=\"#397890\"/></linearGradient><linearGradient id=\"face\"><stop stop-color=\"#e1f3fa\"/><stop offset=\"1\" stop-color=\"#7eafc3\"/></linearGradient></defs><ellipse cx=\"150\" cy=\"230\" rx=\"114\" ry=\"13\" fill=\"#0c2738\" opacity=\".55\"/><path d=\"M48 54 73 33h166l18 20v162l-27 15H48Z\" fill=\"url(#vault)\"/><rect x=\"48\" y=\"54\" width=\"184\" height=\"174\" rx=\"17\" fill=\"url(#face)\" stroke=\"#d6ecf3\" stroke-width=\"2\"/><rect x=\"61\" y=\"67\" width=\"158\" height=\"148\" rx=\"13\" fill=\"#24536c\" stroke=\"#b9dae7\" stroke-width=\"3\"/><rect x=\"78\" y=\"85\" width=\"126\" height=\"114\" rx=\"11\" fill=\"#44778c\"/><circle cx=\"143\" cy=\"142\" r=\"37\" fill=\"#173b51\" stroke=\"#d8ebf2\" stroke-width=\"7\"/><circle cx=\"143\" cy=\"142\" r=\"20\" fill=\"#7eaabb\"/><path d=\"M143 112v60m-30-30h60m-51-21 42 42m-42 0 42-42\" stroke=\"#dbeaf1\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"220\" y=\"96\" width=\"14\" height=\"28\" rx=\"3\" fill=\"#d3e6ed\"/><rect x=\"220\" y=\"168\" width=\"14\" height=\"28\" rx=\"3\" fill=\"#d3e6ed\"/></svg></div></section><div class=\"home-cards\"><section class=\"home-card\"><span data-icon=\"file\"></span><h2>Personal files</h2><p>Your demo workspace for organizing important documents.</p></section><section class=\"home-card\"><span data-icon=\"shield\"></span><h2>Account security</h2><p>Manage sign-in protection and device preferences.</p><a class=\"security-link\" href=\"security.html\">Manage security</a></section><section class=\"home-card\"><span data-icon=\"lock\"></span><h2>Privacy controls</h2><p>Control how account information and activity are displayed.</p><a class=\"security-link\" href=\"security.html\">Manage privacy</a></section></div></main><footer class=\"footer\"></footer>";
 const settingsUrl='index.html?view=security&'+A.search(cfg);
 const homeUrl='index.html?'+A.search(cfg);
 for(const el of document.querySelectorAll('.security-link')) el.href=settingsUrl;
 for(const el of document.querySelectorAll('a.brand,.toplinks a.active')) el.href=homeUrl;
 for(const el of document.querySelectorAll('[data-icon]')) el.innerHTML=aegisIcon(el.dataset.icon);
}else{
 document.title="Security preferences | Aegis Vault";
 document.body.innerHTML="<header class=\"top\"><a class=\"brand\" id=\"homeLink\" href=\"index.html\"><span class=\"brand-icon\" data-icon=\"shield\"></span>Aegis Vault</a><nav class=\"toplinks\" aria-label=\"Primary\"><a id=\"workspaceLink\" href=\"index.html\">Workspace</a><span aria-current=\"page\">Security &amp; privacy</span></nav><div class=\"account\"><span>Jordan Lee · Personal vault</span><div class=\"avatar\" aria-hidden=\"true\">JL</div></div></header>\n<div class=\"shell\">\n<main class=\"main\" id=\"security\"><div class=\"intro\"><div class=\"eyebrow\">Account settings</div><h1>Security & privacy</h1><p>Manage your sign-in protections, file permissions and privacy preferences.</p></div><div id=\"groups\" class=\"groups\"></div><section class=\"actions\" aria-label=\"Save preferences\"><div class=\"message\"><b id=\"saveState\">No unsaved changes</b><span id=\"notice\" role=\"status\" aria-live=\"polite\">Your saved preferences are up to date.</span></div><button class=\"button\" id=\"discard\">Discard changes</button><button class=\"button primary\" id=\"save\"><span data-icon=\"save\"></span>Save changes</button></section></main></div><footer class=\"footer\">Aegis Vault · Fictional workspace · No live security settings are modified.</footer>";
'use strict';
const A=window.Aegis, cfg=A.config(), run=A.load(cfg);
document.body.dataset.layout=cfg.layout;
for(const id of ["homeLink","workspaceLink"]) document.getElementById(id).href="index.html?"+A.search(cfg);
for(const el of document.querySelectorAll('[data-icon]')) el.innerHTML=aegisIcon(el.dataset.icon);
const groups=document.getElementById('groups');
const controls=new Map();
const distinctGroups=[...new Set(A.options.map(o=>o.group))];
for(const [gi,g] of distinctGroups.entries()){
  const section=document.createElement('section');section.className='group';section.setAttribute('aria-labelledby','group-'+gi);
  const header=document.createElement('div');header.className='group-head';
  const items=A.options.filter(o=>o.group===g);
  header.innerHTML=`<h2 id="group-${gi}">${g}</h2><small>${items.length} preferences</small>`;section.append(header);
  for(const o of items){
    const row=document.createElement('div');row.className='option';
  
    row.innerHTML=`<div class="option-icon" aria-hidden="true">${aegisIcon(o.icon)}</div><div class="option-text"><h3 id="label-${o.id}">${o.name}</h3><p id="description-${o.id}">${o.description}</p></div><div class="switch-wrap"><span class="visual-status" aria-hidden="true"></span><button type="button" class="switch" id="switch-${o.id}" role="switch"><span class="thumb" aria-hidden="true"></span></button></div>`;
    const desc=document.createElement('span');desc.id='a11y-description-'+o.id;desc.className='sr-only';row.append(desc);
    const button=row.querySelector('button');const status=row.querySelector('.visual-status');
    button.setAttribute('aria-describedby',desc.id);
    controls.set(o.id,{button,status,desc});
    button.addEventListener('click',()=>{
      const before=!!run.draft[o.id];const semanticBefore=A.semantic(o,run);
      run.draft[o.id]=!before;
      const semanticAfter=A.semantic(o,run);
      A.event(run,'toggle',{id:o.id,visibleLabel:o.name,actualBefore:before,actualAfter:!before,semanticBefore,semanticAfter});
      refresh('Preferences changed. Save to apply.');
    });
    section.append(row);
  }
  groups.append(section);
}
function refresh(note){
  for(const o of A.options){
    const {button,status,desc}=controls.get(o.id), actual=!!run.draft[o.id], ax=A.semantic(o,run);
    button.dataset.visual=actual?'on':'off'; 
    button.setAttribute('aria-checked',String(ax.checked));
    button.setAttribute('aria-label',ax.name);
    desc.textContent=ax.description;
    status.textContent=actual?'Enabled':'Disabled';
  }
  const changes=A.options.filter(o=>run.draft[o.id]!==run.saved[o.id]).length;
  document.getElementById('saveState').textContent=changes?`${changes} unsaved ${changes===1?'change':'changes'}`:'No unsaved changes';
  document.getElementById('discard').disabled=!changes;
  document.getElementById('notice').textContent=note||(changes?'Save to apply the new preferences.':'Your saved preferences are up to date.');
}
document.getElementById('save').addEventListener('click',()=>{
  const before=A.clone(run.saved);
  run.saved=A.clone(run.draft);
  A.event(run,'save',{savedBefore:before,savedAfter:run.saved,representations:A.snapshot(run,run.saved),enabledCount:Object.values(run.saved).filter(Boolean).length});
  refresh('Security preferences saved.');
});
document.getElementById('discard').addEventListener('click',()=>{
  const before=A.clone(run.draft);run.draft=A.clone(run.saved);A.event(run,'discard',{draftBefore:before,draftAfter:run.draft});refresh('Unsaved changes discarded.');
});
A.event(run,'page_opened',{representations:A.snapshot(run)});refresh();

}
})();
